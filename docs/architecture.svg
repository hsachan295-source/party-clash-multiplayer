<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">Party Clash architecture and game flow</title><desc id="desc">Players on phone or desktop use the frontend UI, which calls /.netlify/functions/game. The Netlify Function runs the game logic and server-side scoring and stores room state in Netlify Blobs; synchronized state flows back to all players. Game flow: Create Room, Join Room, Lobby, Start Game, Trivia Round, Submit Answers, Score, Leaderboard, Next Round (8 rounds), Final Winner, Rematch.</desc><defs><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c6ff3d"/></marker></defs><rect width="1280" height="580" rx="24" fill="#0b0c22"/><text x="40" y="50" font-size="26" fill="#f5f5ff" font-weight="800" text-anchor="start">Party Clash: After Hours Trivia</text><text x="40" y="76" font-size="15" fill="#a9acd0" font-weight="400" text-anchor="start">How the multiplayer game works</text><text x="40" y="122" font-size="13" fill="#c6ff3d" font-weight="800" text-anchor="start">ARCHITECTURE</text><rect x="26.0" y="140" width="168" height="92" rx="14" fill="#171a3f" stroke="#c6ff3d" stroke-width="2"/><text x="110.0" y="182.5" font-size="15" fill="#f5f5ff" font-weight="700" text-anchor="middle">Players</text><text x="110.0" y="203.5" font-size="12" fill="#c6ff3d" font-weight="600" text-anchor="middle">Phone / Desktop</text><rect x="238.0" y="140" width="168" height="92" rx="14" fill="#171a3f" stroke="#a78bfa" stroke-width="2"/><text x="322.0" y="182.5" font-size="15" fill="#f5f5ff" font-weight="700" text-anchor="middle">Frontend UI</text><text x="322.0" y="203.5" font-size="12" fill="#a78bfa" font-weight="600" text-anchor="middle">Vite + TypeScript</text><rect x="450.0" y="140" width="168" height="92" rx="14" fill="#171a3f" stroke="#22d3ee" stroke-width="2"/><text x="534.0" y="173.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">/.netlify/</text><text x="534.0" y="191.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">functions/game</text><text x="534.0" y="211.0" font-size="12" fill="#22d3ee" font-weight="600" text-anchor="middle">HTTPS POST</text><rect x="662.0" y="140" width="168" height="92" rx="14" fill="#171a3f" stroke="#facc15" stroke-width="2"/><text x="746.0" y="182.5" font-size="15" fill="#f5f5ff" font-weight="700" text-anchor="middle">Netlify Function</text><text x="746.0" y="203.5" font-size="12" fill="#facc15" font-weight="600" text-anchor="middle">game.ts</text><rect x="874.0" y="140" width="168" height="92" rx="14" fill="#171a3f" stroke="#f472b6" stroke-width="2"/><text x="958.0" y="182.5" font-size="15" fill="#f5f5ff" font-weight="700" text-anchor="middle">Game Logic</text><text x="958.0" y="203.5" font-size="12" fill="#f472b6" font-weight="600" text-anchor="middle">server-side scoring</text><rect x="1086.0" y="140" width="168" height="92" rx="14" fill="#171a3f" stroke="#4ade80" stroke-width="2"/><text x="1170.0" y="182.5" font-size="15" fill="#f5f5ff" font-weight="700" text-anchor="middle">Netlify Blobs</text><text x="1170.0" y="203.5" font-size="12" fill="#4ade80" font-weight="600" text-anchor="middle">room state</text><line x1="198.0" y1="186.0" x2="232.0" y2="186.0" stroke="#facc15" stroke-width="2.5" marker-end="url(#ay)"/><line x1="410.0" y1="186.0" x2="444.0" y2="186.0" stroke="#facc15" stroke-width="2.5" marker-end="url(#ay)"/><line x1="622.0" y1="186.0" x2="656.0" y2="186.0" stroke="#facc15" stroke-width="2.5" marker-end="url(#ay)"/><line x1="834.0" y1="186.0" x2="868.0" y2="186.0" stroke="#facc15" stroke-width="2.5" marker-end="url(#ay)"/><line x1="1046.0" y1="186.0" x2="1080.0" y2="186.0" stroke="#facc15" stroke-width="2.5" marker-end="url(#ay)"/><path d="M 1170.0 236 V 272 H 110.0 V 240" fill="none" stroke="#c6ff3d" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#al)"/><text x="640.0" y="262" font-size="14" fill="#c6ff3d" font-weight="700" text-anchor="middle">synchronized state back to all players  (every browser checks in about once a second)</text><text x="40" y="330" font-size="13" fill="#c6ff3d" font-weight="800" text-anchor="start">GAME FLOW</text><rect x="32.0" y="352" width="96" height="74" rx="14" fill="#171a3f" stroke="#a78bfa" stroke-width="2"/><text x="80.0" y="385.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Create</text><text x="80.0" y="403.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Room</text><rect x="144.0" y="352" width="96" height="74" rx="14" fill="#171a3f" stroke="#a78bfa" stroke-width="2"/><text x="192.0" y="385.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Join</text><text x="192.0" y="403.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Room</text><rect x="256.0" y="352" width="96" height="74" rx="14" fill="#171a3f" stroke="#a78bfa" stroke-width="2"/><text x="304.0" y="394.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Lobby</text><rect x="368.0" y="352" width="96" height="74" rx="14" fill="#171a3f" stroke="#a78bfa" stroke-width="2"/><text x="416.0" y="385.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Start</text><text x="416.0" y="403.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Game</text><rect x="480.0" y="352" width="96" height="74" rx="14" fill="#2a1f55" stroke="#a78bfa" stroke-width="2"/><text x="528.0" y="385.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Trivia</text><text x="528.0" y="403.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Round</text><rect x="592.0" y="352" width="96" height="74" rx="14" fill="#2a1f55" stroke="#a78bfa" stroke-width="2"/><text x="640.0" y="385.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Submit</text><text x="640.0" y="403.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Answers</text><rect x="704.0" y="352" width="96" height="74" rx="14" fill="#2a1f55" stroke="#a78bfa" stroke-width="2"/><text x="752.0" y="394.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Score</text><rect x="816.0" y="352" width="96" height="74" rx="14" fill="#2a1f55" stroke="#a78bfa" stroke-width="2"/><text x="864.0" y="385.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Leader-</text><text x="864.0" y="403.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">board</text><rect x="928.0" y="352" width="96" height="74" rx="14" fill="#2a1f55" stroke="#a78bfa" stroke-width="2"/><text x="976.0" y="385.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Next</text><text x="976.0" y="403.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Round</text><rect x="1040.0" y="352" width="96" height="74" rx="14" fill="#171a3f" stroke="#a78bfa" stroke-width="2"/><text x="1088.0" y="385.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Final</text><text x="1088.0" y="403.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Winner</text><rect x="1152.0" y="352" width="96" height="74" rx="14" fill="#171a3f" stroke="#a78bfa" stroke-width="2"/><text x="1200.0" y="394.0" font-size="14" fill="#f5f5ff" font-weight="700" text-anchor="middle">Rematch</text><line x1="130.0" y1="389.0" x2="140.0" y2="389.0" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ap)"/><line x1="242.0" y1="389.0" x2="252.0" y2="389.0" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ap)"/><line x1="354.0" y1="389.0" x2="364.0" y2="389.0" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ap)"/><line x1="466.0" y1="389.0" x2="476.0" y2="389.0" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ap)"/><line x1="578.0" y1="389.0" x2="588.0" y2="389.0" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ap)"/><line x1="690.0" y1="389.0" x2="700.0" y2="389.0" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ap)"/><line x1="802.0" y1="389.0" x2="812.0" y2="389.0" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ap)"/><line x1="914.0" y1="389.0" x2="924.0" y2="389.0" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ap)"/><line x1="1026.0" y1="389.0" x2="1036.0" y2="389.0" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ap)"/><line x1="1138.0" y1="389.0" x2="1148.0" y2="389.0" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ap)"/><path d="M 976.0 430 V 460 H 528.0 V 434" fill="none" stroke="#c6ff3d" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#al)"/><text x="752.0" y="452" font-size="13" fill="#c6ff3d" font-weight="700" text-anchor="middle">repeat for 8 rounds</text><path d="M 1200.0 430 V 504 H 304.0 V 434" fill="none" stroke="#c6ff3d" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#al)"/><text x="752.0" y="496" font-size="13" fill="#c6ff3d" font-weight="700" text-anchor="middle">Play Again: same room, scores reset</text><text x="640.0" y="556" font-size="13" fill="#a9acd0" font-weight="400" text-anchor="middle">2–8 players · join with a 4-letter room code · 15 s per question · server keeps the score</text></svg>
